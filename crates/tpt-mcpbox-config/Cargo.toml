[package]
name = "tpt-mcpbox-config"
description = "Configuration model, validation, discovery, layering and secret handling for tpt-mcpbox."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
categories = ["config","parser-implementations"]
readme = "README.md"
keywords = ["config","yaml","secrets","validation","json-schema"]

[lints]
workspace = true

[dependencies]
# serde_norway is a maintained drop-in fork of the deprecated serde_yaml 0.9,
# with the same API and no unmaintained `unsafe-libyaml` dependency.
serde_norway = { workspace = true }
regex = { workspace = true }
schemars = { version = "1", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
