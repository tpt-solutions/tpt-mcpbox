[package]
name = "tpt-mcpbox-config"
description = "Configuration model, validation, discovery, layering and secret handling for tpt-mcpbox."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[dependencies]
# serde_yaml is deprecated upstream but remains the only stable pure-Rust YAML
# 1.2 implementation that does not pull in an unsafe C parser; revisit when the
# ecosystem settles (tracked in todo.md, Phase 2).
serde_yaml = "0.9"
schemars = { version = "1", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
