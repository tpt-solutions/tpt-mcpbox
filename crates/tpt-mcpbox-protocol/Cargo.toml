[package]
name = "tpt-mcpbox-protocol"
description = "MCP JSON-RPC 2.0 protocol types, stdio/Streamable-HTTP transports and session handling for tpt-mcpbox."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
categories = ["network-programming","encoding"]
readme = "README.md"
keywords = ["mcp","json-rpc","jsonrpc","streamable-http","stdio"]

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
jsonschema = { version = "0.60", default-features = false }
tokio = { workspace = true, features = ["test-util"] }
