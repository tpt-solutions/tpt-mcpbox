[package]
name = "tpt-mcpbox-http"
description = "The HTTP/1.1 server surface the MCP transports need: exact-path routing, request and response bodies, JSON and server-sent-event responses, and a graceful serve loop. Built on hyper; replaces the axum subset the workspace used."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
categories = ["network-programming", "web-programming::http-server"]
readme = "README.md"
keywords = ["http", "server", "sse", "hyper"]

[lints]
workspace = true

[dependencies]
bytes = "1"
futures = { workspace = true }
http = { workspace = true }
http-body = "1"
http-body-util = "0.1"
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "server-graceful", "http1", "tokio"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "time", "rt", "macros"] }
tower = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
