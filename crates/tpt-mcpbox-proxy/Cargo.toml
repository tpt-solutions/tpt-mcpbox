[package]
name = "tpt-mcpbox-proxy"
description = "Policy-enforcing MCP client passthrough to external (stdio and Streamable HTTP) MCP servers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
categories = ["network-programming","web-programming::http-client"]
readme = "README.md"
keywords = ["mcp","proxy","upstream","stdio","http-client"]

[lints]
workspace = true

[dependencies]
tpt-mcpbox-config = { workspace = true }
tpt-mcpbox-policy = { workspace = true }
tpt-mcpbox-protocol = { workspace = true }
regex = { workspace = true }
bytes = "1"
futures = { workspace = true }
http-body-util = "0.1"
hyper = { workspace = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "logging"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
rustls = { workspace = true }
tpt-crypto-rustls = { workspace = true }
webpki-roots = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
tpt-mcpbox-http = { workspace = true }
http = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "io-util"] }
