# cargo-deny configuration. Licences, advisories, sources and duplicate bans are
# enforced in CI; run locally with `cargo deny check`.
# Schema: cargo-deny 0.20.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
exclude-dev = false

[advisories]
# Do not ship code with known vulnerabilities. Ignored advisories must carry a
# reason and an expiry.
ignore = []

[licenses]
# Kept minimal on purpose: every allowance here is a licence decision, and
# unused entries are reported as warnings by cargo-deny.
# Re-add (with a comment explaining why) when a new dependency needs one.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = false
highlight = "all"
# Duplicated stacks: pick one implementation per capability.
deny = [
    { name = "reqwest" },
    { name = "openssl" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
