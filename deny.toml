# cargo-deny configuration. Licences, advisories, sources and duplicate bans are
# enforced in CI; run locally with `cargo deny check`.
# Schema: cargo-deny 0.20.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
exclude-dev = false

[advisories]
# Do not ship code with known vulnerabilities. Ignored advisories must carry a
# reason and an expiry.
ignore = []

[licenses]
# Every entry is a licence decision, and cargo-deny warns about unused ones.
# Note that a compound expression such as "MIT AND BSD-3-Clause" requires *each*
# part to be allowed here (e.g. `matchit`, a dependency of axum).
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    # Required by `unicode-ident` ("(MIT OR Apache-2.0) AND Unicode-3.0").
    "Unicode-3.0",
    # Required by Wasmtime's Cranelift crates.
    "Apache-2.0 WITH LLVM-exception",
    # Required by `ring`, `rustls-webpki` and `untrusted` ("Apache-2.0 AND ISC").
    "ISC",
    # Required by `webpki-roots` (Mozilla root store data).
    "CDLA-Permissive-2.0",
    # Required by `foldhash`.
    "Zlib",
]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = false
highlight = "all"
# Duplicated stacks: pick one implementation per capability.
deny = [
    { name = "reqwest" },
    { name = "openssl" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
