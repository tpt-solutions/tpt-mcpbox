[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = []
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
checksum = "sha256"
cargo-auditable = true
cargo-cyclonedx = true
pr-run-mode = "skip"
install-updater = false
# .github/workflows/release.yml is generated by `dist generate` and then edited
# by hand so that it never creates a GitHub Release (see its header).
allow-dirty = ["ci"]
