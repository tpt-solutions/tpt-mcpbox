[package]
name = "tpt-mcpbox-tool-fs"
description = "Example tool: read files under ./workspace and write under ./workspace/output."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# A tool component is its own workspace, built for wasm32-wasip2.
[workspace]

[lib]
name = "tpt_mcpbox_tool_fs"
crate-type = ["cdylib"]

[dependencies]
tpt-mcpbox-sdk = { path = "../../crates/tpt-mcpbox-sdk" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
