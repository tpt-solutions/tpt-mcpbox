name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, Sunday 03:00 UTC. Only the fuzz job runs on this schedule.
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast feedback: fmt + clippy + tests on the host toolchain.
  lint:
    if: github.event_name != 'schedule'
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    if: github.event_name != 'schedule'
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The sandbox tests build the guest fixture for this target.
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  # The MSRV must keep compiling; bumping it is a conscious decision.
  msrv:
    if: github.event_name != 'schedule'
    name: msrv (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  # Cross-compile check for the four release targets. Guest crates are excluded
  # from the workspace, so this stays fast.
  # Each target runs on its own host. C build scripts such as ring's use the
  # host cc, which only accepts the Apple flags on macOS.
  cross:
    if: github.event_name != 'schedule'
    name: check ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --target ${{ matrix.target }}

  supply-chain:
    if: github.event_name != 'schedule'
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  # Guest crates build for wasm32-wasip2 with cargo-component.
  guest:
    if: github.event_name != 'schedule'
    name: guest crates
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-component --locked
      - run: cargo component build --release --manifest-path tools/tpt-mcpbox-tool-github/Cargo.toml
      - run: cargo component build --release --manifest-path tools/tpt-mcpbox-tool-fs/Cargo.toml

  # Parser fuzzing: each target runs for a bounded time once a week (and on
  # manual dispatch), not on every change. A crash fails the job and uploads the
  # reproducer as an artifact. The sanitizer flags need the Rust nightly
  # toolchain, so the job pins it for every step, not just the install.
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    strategy:
      fail-fast: false
      matrix:
        target: [jsonrpc_parse, config_load, policy_input]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run --fuzz-dir fuzz ${{ matrix.target }} -- -max_total_time=60
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  # The warm-pool overhead budget from the spec (< 5 ms per invocation). The
  # check uses the median of criterion's estimate, on a shared runner, so it is
  # a regression alarm rather than a precise measurement.
  bench:
    if: github.event_name != 'schedule'
    name: benchmark (warm invocation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The bench builds the guest fixture for this target.
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p tpt-mcpbox-runtime --bench invocation -- --warm-up-time 2 --measurement-time 5
      - name: Check the warm-call median is under 5 ms
        shell: bash
        run: |
          estimates=$(find target/criterion -path '*warm*echo*invocation*new*estimates.json' | head -n 1)
          test -n "$estimates" || { echo "no criterion estimate found"; exit 1; }
          median=$(jq '.median.point_estimate' "$estimates")
          echo "warm echo median: ${median} ns"
          awk -v m="$median" 'BEGIN { exit !(m < 5000000) }'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: criterion-report
          path: target/criterion
          if-no-files-found: ignore

  # Software bill of materials for the host workspace, in CycloneDX. The release
  # job attaches it to the GitHub release once that workflow exists.
  sbom:
    if: github.event_name != 'schedule'
    name: sbom (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-cyclonedx --locked
      - run: cargo cyclonedx --format json --all --override-filename tpt-mcpbox-sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "**/tpt-mcpbox-sbom.cdx.json"

  # The book is built on every change so that a broken include or link fails
  # the build. Publishing it is a separate decision.
  docs:
    if: github.event_name != 'schedule'
    name: docs (mdbook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install mdbook --locked
      - run: mdbook build
