[package]
name = "tpt-mcpbox-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
tpt-mcpbox-config = { path = "../crates/tpt-mcpbox-config" }
tpt-mcpbox-policy = { path = "../crates/tpt-mcpbox-policy" }
tpt-mcpbox-protocol = { path = "../crates/tpt-mcpbox-protocol" }

# Not part of the host workspace: fuzz builds use their own target directory
# (`target-fuzz/`, see .gitignore) and nightly-only sanitizers.
[workspace]

[[bin]]
name = "jsonrpc_parse"
path = "fuzz_targets/jsonrpc_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_load"
path = "fuzz_targets/config_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_input"
path = "fuzz_targets/policy_input.rs"
test = false
doc = false
bench = false
