msrv = "1.85"

# Correctness lints that are valuable for a security-focused project and are not
# enabled by default.
correctness = { level = "warn", priority = -1 }

disallowed-methods = [
    { path = "std::env::set_var", reason = "process-wide state; use explicit configuration instead" },
    { path = "std::env::remove_var", reason = "process-wide state; use explicit configuration instead" },
]

# `todo!`/`unimplemented!` indicate unfinished security-relevant work.
todo = "warn"
unimplemented = "warn"
