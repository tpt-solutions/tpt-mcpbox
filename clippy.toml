# Clippy configuration. Rustc lint levels live in Cargo.toml
# `[workspace.lints]`; only clippy-specific knobs belong here.
msrv = "1.85"

# Process-wide state changes are a design smell in a daemon: configuration must
# be explicit so reloads are observable.
disallowed-methods = [
    { path = "std::env::set_var", reason = "process-wide state; use explicit configuration instead" },
    { path = "std::env::remove_var", reason = "process-wide state; use explicit configuration instead" },
]
